<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>塔罗记忆翻牌</title>
<link rel="stylesheet" href="memory.css?v=3">
<script src="../../data.js"></script>
</head>
<body>
<div class="mem-root">
  <button class="mem-sound" id="memSound" type="button" aria-label="关闭声音" title="声音开关">🔊</button>

  <!-- 开局：选牌组 -->
  <section class="mem-setup" id="memSetup">
    <div class="mem-head">
      <div class="mem-title">塔罗记忆</div>
      <div class="mem-sub">翻开两张相同的牌，在时间内全部配对</div>
    </div>
    <div class="mem-level" id="memLevelBox">
      <div class="mem-level-head">
        <span>当前难度 · <b id="memLevelName">标准</b></span>
        <span class="mem-level-rule">通关升级 / 失败降级</span>
      </div>
      <div class="mem-level-track" id="memLevelTrack"></div>
    </div>
    <div class="mem-tip">闯关难度自动递增：轻松 6 对 75 秒、标准 8 对 60 秒、挑战 10 对 70 秒、大师 12 对 80 秒。挑战 / 大师错配会扣时间。通关点亮本局的牌（难度越高点亮越多），集齐一套即可抽牌时使用。</div>
    <button class="mem-primary mem-primary-top" id="memStart" type="button">开始游戏</button>
    <div class="mem-section-label">选择卡面</div>
    <div class="mem-decks" id="memDecks"></div>
  </section>

  <!-- 游戏中 -->
  <section class="mem-play" id="memPlay" hidden>
    <div class="mem-hud">
      <div class="mem-hud-item"><span class="mem-hud-label">剩余</span><span class="mem-hud-value" id="memTime">60</span></div>
      <div class="mem-hud-item"><span class="mem-hud-label">步数</span><span class="mem-hud-value" id="memMoves">0</span></div>
      <div class="mem-hud-item"><span class="mem-hud-label">连击</span><span class="mem-hud-value" id="memCombo">×0</span></div>
      <div class="mem-hud-deck" id="memHudDeck"></div>
    </div>
    <div class="mem-progress"><div class="mem-progress-bar" id="memProgressBar"></div></div>
    <div class="mem-grid" id="memGrid"></div>
  </section>

  <!-- 结算 -->
  <section class="mem-result" id="memResult" hidden>
    <div class="mem-result-icon" id="memResultIcon">✦</div>
    <div class="mem-result-title" id="memResultTitle">通关</div>
    <div class="mem-result-desc" id="memResultDesc"></div>
    <div class="mem-level-change" id="memLevelChange" hidden></div>
    <div class="mem-stats" id="memStats"></div>
    <div class="mem-unlocks" id="memUnlocks"></div>
    <div class="mem-actions">
      <button class="mem-primary" id="memAgain" type="button">再玩一次</button>
      <button class="mem-ghost" id="memBack" type="button">换卡面</button>
    </div>
  </section>

</div>
<script src="memory.js?v=3"></script>
</body>
</html>
